name: Deploy Product Tutorials

# Reusable workflow: one generic build+deploy sequence for a single product,
# for a single environment (production or staging), called by each product
# content repo's own workflow on every push to main. Replaces the old
# per-product-per-environment files (production-<product>-bunnynet.yml /
# staging-<product>-bunnynet.yml) and the git-push-based content replication
# into Aspose/tutorials.aspose.com (andstor/copycat-action) that used to feed
# them -- content is combined with the site's config/theme only in this
# ephemeral run, never committed anywhere.

on:
  workflow_call:
    inputs:
      product:
        description: "Product slug, e.g. 'words', 'pdf' -- must match the calling repo's own top-level content folder, configs/<product>.toml, and the live URL path segment"
        required: true
        type: string
      environment:
        description: "'production' or 'staging'"
        required: true
        type: string
    secrets:
      REPO_TOKEN:
        required: true
      CEPH_S3_LIVE_ACCESS_KEY:
        required: true
      CEPH_S3_LIVE_SECRET_KEY:
        required: true
      CEPH_S3_QA_ACCESS_KEY:
        required: true
      CEPH_S3_QA_SECRET_KEY:
        required: true
      BUNNY_API_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve environment settings
        id: envcfg
        run: |
          case "${{ inputs.environment }}" in
            production)
              echo "theme_ref=main" >> "$GITHUB_OUTPUT"
              echo "base_url=https://tutorials.aspose.com/${{ inputs.product }}/" >> "$GITHUB_OUTPUT"
              echo "hugo_extra_flags=" >> "$GITHUB_OUTPUT"
              echo "purge_url=https://tutorials.aspose.com/${{ inputs.product }}" >> "$GITHUB_OUTPUT"
              echo "rewrite_domain=false" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "theme_ref=beta" >> "$GITHUB_OUTPUT"
              echo "base_url=https://qa-tutorials.aspose.com/${{ inputs.product }}/" >> "$GITHUB_OUTPUT"
              echo "hugo_extra_flags=--environment staging" >> "$GITHUB_OUTPUT"
              echo "purge_url=https://qa-tutorials.aspose.com/${{ inputs.product }}" >> "$GITHUB_OUTPUT"
              echo "rewrite_domain=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown environment '${{ inputs.environment }}' -- must be 'production' or 'staging'"
              exit 1
              ;;
          esac

      - name: Checkout site repo (config/theme scaffolding only, no content)
        uses: actions/checkout@main
        with:
          repository: Aspose/tutorials.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            archetypes
            configs
            data
            hugo.toml
          sparse-checkout-cone-mode: false

      - name: Checkout product content (this repo's own push)
        uses: actions/checkout@main
        with:
          path: __product_src__

      - name: Checkout theme repo
        uses: actions/checkout@main
        with:
          repository: Aspose/tutorials-theme
          ref: ${{ steps.envcfg.outputs.theme_ref }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          path: themes/tutorials-theme

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.135.0'
          extended: true

      - name: Install autoprefixer
        run: npm install -D --save autoprefixer

      - name: Install postcss-cli
        run: npm install -D --save postcss-cli

      - name: Overlay product content (filesystem copy, never committed)
        run: |
          rm -rf "content/${{ inputs.product }}"
          mkdir -p "content/${{ inputs.product }}"
          cp -a "__product_src__/${{ inputs.product }}/." "content/${{ inputs.product }}/"

      - name: Find and replace url param in frontmatter
        uses: jacobtomlinson/gha-find-replace@v2
        with:
          find: "url:"
          replace: "url_ignore:"
          include: "content/${{ inputs.product }}/**/_index.md"

      - name: Find and replace image url domain
        uses: jacobtomlinson/gha-find-replace@v2
        with:
          find: "logoImageSrc=\"https://www.aspose.cloud/"
          replace: "logoImageSrc=\"https://cms.admin.containerize.com/"
          include: "content/${{ inputs.product }}/**/_index.md"

      - name: Find and replace domain name (staging only)
        if: steps.envcfg.outputs.rewrite_domain == 'true'
        uses: jacobtomlinson/gha-find-replace@v2
        with:
          find: "tutorials.aspose.com"
          replace: "tutorials2.aspose.com"
          include: "content/${{ inputs.product }}/**/_index.md"

      - name: Build
        run: |
          hugo --config "configs/${{ inputs.product }}.toml" -c "content/${{ inputs.product }}" \
            -b "${{ steps.envcfg.outputs.base_url }}" ${{ steps.envcfg.outputs.hugo_extra_flags }} \
            --cleanDestinationDir --minify

      - name: Sync to Ceph S3
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            export AWS_ACCESS_KEY_ID="$CEPH_S3_LIVE_ACCESS_KEY"
            export AWS_SECRET_ACCESS_KEY="$CEPH_S3_LIVE_SECRET_KEY"
            export AWS_ENDPOINT_URL="https://s3-admin.dynabic.com"
            ENDPOINT="https://s3.dynabic.com"
            BUCKET="tutorials-aspose-com"
          else
            export AWS_ACCESS_KEY_ID="$CEPH_S3_QA_ACCESS_KEY"
            export AWS_SECRET_ACCESS_KEY="$CEPH_S3_QA_SECRET_KEY"
            export AWS_ENDPOINT_URL="https://s3-admin-qa.dynabic.com"
            ENDPOINT="https://s3-qa.dynabic.com"
            BUCKET="qa-tutorials-aspose-com"
          fi
          aws s3 sync ./public/ "s3://$BUCKET/${{ inputs.product }}/" \
            --endpoint-url "$ENDPOINT" \
            --acl public-read \
            --delete
        env:
          AWS_DEFAULT_REGION: us-east-1
          CEPH_S3_LIVE_ACCESS_KEY: ${{ secrets.CEPH_S3_LIVE_ACCESS_KEY }}
          CEPH_S3_LIVE_SECRET_KEY: ${{ secrets.CEPH_S3_LIVE_SECRET_KEY }}
          CEPH_S3_QA_ACCESS_KEY: ${{ secrets.CEPH_S3_QA_ACCESS_KEY }}
          CEPH_S3_QA_SECRET_KEY: ${{ secrets.CEPH_S3_QA_SECRET_KEY }}

      - name: Purge BunnyCDN Cache
        run: |
          curl -siG \
            -H "X-Api-Key: ${{ secrets.BUNNY_API_KEY }}" \
            --data-urlencode "url=${{ steps.envcfg.outputs.purge_url }}" \
            "https://api.dynabic.com/bn/purge?async=true"
